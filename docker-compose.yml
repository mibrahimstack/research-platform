services:
  api:
    build:
      context: .
      args:
        INSTALL_ML: "true"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - neo4j
      - redis
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app

  dashboard:
    build:
      context: .
      args:
        INSTALL_ML: "true"
    # Added --server.fileWatcherType none to the end of the command
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.fileWatcherType none
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - API_BASE_URL=http://api:8000

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.13
    restart: unless-stopped
    environment:
      # Changed password to meet the 8-character minimum requirement
      NEO4J_AUTH: "neo4j/password123" 
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
